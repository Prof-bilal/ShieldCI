name: ShieldCI verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install local runtime tools
        run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - name: Run ShieldCI verification gate
        run: make verify

  warden-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build pinned Warden
        working-directory: engine/warden/warden-starter/warden
        run: go build -buildvcs=false -o /tmp/warden ./cmd/warden
      - name: Prove allow and deny behavior
        run: ./scripts/warden-proof.sh /tmp/warden
